name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Application quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check style, vet, and tests
        run: make check

      - name: Build frontend and server binaries
        run: make build
